<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anchor &amp; Oak | Inlet Beach, 30A</title>
<meta name="description" content="Anchor &amp; Oak is a beach house rental in Inlet Beach, Florida, on 30A. Opening soon.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌊</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --sand: #EADFC8;
    --foam: #F7F4EE;
    --gulf: #1D4A55;
    --seaglass: #A9D3C9;
    --shade: rgba(14, 38, 44, 0.72);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Figtree", system-ui, -apple-system, sans-serif;
    color: var(--foam);
    background: var(--gulf);
  }
  .hero {
    position: relative;
    min-height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: max(2rem, env(safe-area-inset-top)) clamp(1.5rem, 6vw, 5rem)
             max(2.5rem, env(safe-area-inset-bottom));
    background:
      linear-gradient(to top, var(--shade) 0%, rgba(14,38,44,0.25) 45%, rgba(14,38,44,0) 70%),
      url("beach.jpg") center 60% / cover no-repeat,
      linear-gradient(180deg, #8FC3D6 0%, #CFE3E2 48%, var(--sand) 49%, #D9C7A4 100%);
  }
  h1 { margin: 0; }
  .logo {
    display: block;
    width: min(100%, 760px);
    height: auto;
    filter: drop-shadow(0 2px 14px rgba(0,0,0,0.35));
  }
  .note {
    margin-top: 1.5rem;
    max-width: 34rem;
    font-size: 1.05rem;
    line-height: 1.6;
  }
  .note a {
    color: var(--seaglass);
    text-decoration-thickness: 1px;
    text-underline-offset: 3px;
    font-weight: 500;
  }
  .note a:hover { color: var(--foam); }
  .note a:focus-visible { outline: 2px solid var(--seaglass); outline-offset: 3px; }
  footer {
    margin-top: 2.5rem;
    font-size: 0.85rem;
    color: rgba(247, 244, 238, 0.7);
  }
</style>
</head>
<body>
  <main class="hero">
    <h1><img class="logo" src="logo.png" alt="Anchor &amp; Oak, Inlet Beach, 30A, Emerald Coast" width="1600" height="527"></h1>
    <p class="note">
      A beach house in Inlet Beach, Florida, just off 30A. We're getting it ready for guests. To ask about dates or get on the list for opening,
      email <a href="mailto:info@aogetaway.com">info@aogetaway.com</a>.
    </p>
    <footer>&copy; <span id="yr">2026</span> Anchor &amp; Oak</footer>
  </main>
  <script>document.getElementById("yr").textContent = new Date().getFullYear();</script>
</body>
</html>
